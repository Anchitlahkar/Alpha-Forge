<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brief &mdash; 2026-08-13</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2312130F'/><rect x='3' y='3' width='10' height='10' fill='%23C8452B'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;

            --bg: #12130F;
            --surface: #191B15;
            --surface-hover: #22241C;
            --border: #32352A;

            --text: #E8E6DF;
            --text-dim: #C6C5BB;
            --text-muted: #9A9C90;

            /* The only chromatic accent on the page. It belongs to the score. */
            --score: #C8452B;

            --font-prose: 'IBM Plex Sans', ui-sans-serif, "Segoe UI", system-ui, sans-serif;
            --font-data: 'IBM Plex Mono', ui-monospace, "Cascadia Mono", Consolas, monospace;

            --t-xs: 0.8125rem;
            --t-body: 1.0625rem;
            --t-md: 1.3125rem;
            --t-lg: 1.6875rem;
            --t-xl: 2.625rem;

            --s1: 4px;  --s2: 8px;  --s3: 12px;
            --s4: 20px; --s5: 32px; --s6: 56px;

            --r-card: 12px;
            --r-pill: 999px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-prose);
            font-size: var(--t-body);
            font-weight: 400;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: var(--s6) var(--s4) 96px;
        }

        /* ---- masthead: left-aligned, date hung opposite ---- */
        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: var(--s4);
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
            padding-bottom: var(--s4);
            margin-bottom: var(--s6);
        }

        h1 {
            font-size: var(--t-xl);
            font-weight: 600;
            line-height: 1.05;
            letter-spacing: -0.02em;
            margin: 0;
            color: var(--text);
        }

        .masthead-meta {
            font-family: var(--font-data);
            font-size: var(--t-xs);
            line-height: 1.2;
            color: var(--text-muted);
            text-align: right;
        }

        h2 {
            font-size: var(--t-lg);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.01em;
            color: var(--text);
            margin: var(--s6) 0 var(--s4);
        }

        section[id] { scroll-margin-top: var(--s5); }

        /* ---- the stale notice: stated plainly, not decorated ---- */
        .stale {
            font-family: var(--font-data);
            font-size: var(--t-xs);
            line-height: 1.5;
            color: var(--text-dim);
            border: 1px solid var(--border);
            border-radius: var(--r-card);
            padding: var(--s3) var(--s4);
            margin-bottom: var(--s5);
        }
        .stale strong { color: var(--score); font-weight: 500; }

        /* ---- cards: one base, then lead and tail ---- */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-card);
            padding: 24px 28px;
            margin-bottom: var(--s4);
            transition: border-color 120ms linear;
        }
        .card:hover { border-color: #454936; }

        .card--lead {
            padding: 40px 44px;
            margin-bottom: var(--s6);
        }
        .card--lead .card-title { font-size: 2.1rem; }

        .card--tail {
            background: none;
            border: none;
            border-top: 1px solid var(--border);
            border-radius: 0;
            padding: var(--s4) 0;
            margin-bottom: 0;
        }
        .card--tail .card-title { font-size: var(--t-body); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--s3);
            flex-wrap: wrap;
            gap: var(--s3);
        }

        .card-title {
            font-size: var(--t-md);
            font-weight: 600;
            line-height: 1.25;
            letter-spacing: -0.01em;
            margin: 0;
            color: var(--text);
            max-width: 32ch;
            flex: 1;
            min-width: 240px;
        }

        .badges {
            display: flex;
            gap: var(--s2);
            align-items: center;
            flex-shrink: 0;
        }

        .badge {
            font-family: var(--font-data);
            font-size: var(--t-xs);
            font-weight: 500;
            line-height: 1.2;
            padding: 3px 10px;
            border-radius: var(--r-pill);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .badge-score {
            color: var(--score);
            border-color: var(--score);
            text-transform: none;
            letter-spacing: 0.02em;
        }

        .meta-line {
            font-family: var(--font-data);
            font-size: var(--t-xs);
            line-height: 1.2;
            color: var(--text-muted);
            margin-bottom: var(--s5);
            display: flex;
            gap: var(--s4);
            flex-wrap: wrap;
        }
        .meta-stale { color: var(--score); }

        .section-title {
            font-family: var(--font-data);
            font-size: var(--t-xs);
            font-weight: 500;
            line-height: 1.2;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: var(--s5) 0 var(--s1);
        }

        /* The considered paragraph. Marked by measure, not by a stripe. */
        .why-it-matters {
            font-style: italic;
            color: var(--text-dim);
            max-width: 62ch;
            margin: var(--s1) 0 var(--s5);
        }

        .tldr {
            margin: 0 0 var(--s5);
            max-width: 68ch;
        }

        .card ul {
            margin: 0 0 var(--s5);
            padding-left: 1.15em;
            max-width: 68ch;
        }
        .card li {
            line-height: 1.5;
            margin-bottom: 0.7em;
            color: var(--text-dim);
        }

        .sources {
            font-family: var(--font-data);
            font-size: var(--t-xs);
            line-height: 1.5;
            color: var(--text-muted);
            margin: 0 0 var(--s5);
            padding-left: 1.15em;
            max-width: 68ch;
        }
        .sources li { margin-bottom: var(--s1); }

        .card-footer {
            border-top: 1px solid var(--border);
            padding-top: var(--s4);
            margin-top: var(--s5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--s3);
        }
        .card--tail .card-footer {
            border-top: none;
            padding-top: 0;
            margin-top: var(--s3);
        }
        .footer-note {
            font-family: var(--font-data);
            font-size: var(--t-xs);
            color: var(--text-muted);
        }

        .btn-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text);
            background: transparent;
            border: 1px solid var(--border);
            padding: 7px 16px;
            border-radius: var(--r-card);
            font-size: var(--t-xs);
            font-family: var(--font-data);
            text-decoration: none;
            transition: background-color 100ms linear, border-color 100ms linear;
        }
        .btn-link:hover {
            background: var(--surface-hover);
            border-color: #454936;
        }
        .btn-link .arrow {
            display: inline-block;
            transition: transform 140ms cubic-bezier(0.2, 0, 0, 1);
        }
        .btn-link:hover .arrow { transform: translateX(3px); }

        /* ---- the remainder: one line each, no card, no repetition ---- */
        .rest-intro {
            font-family: var(--font-data);
            font-size: var(--t-xs);
            color: var(--text-muted);
            margin: 0 0 var(--s4);
        }
        .rest-list { list-style: none; margin: 0; padding: 0; }
        .rest-item {
            display: flex;
            align-items: baseline;
            gap: var(--s3);
            padding: var(--s3) 0;
            border-top: 1px solid var(--border);
        }
        .rest-score {
            font-family: var(--font-data);
            font-size: var(--t-xs);
            color: var(--score);
            flex-shrink: 0;
            min-width: 3.5em;
        }
        .rest-title { flex: 1; min-width: 0; }
        .rest-title a {
            color: var(--text);
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-color: var(--border);
            transition: text-decoration-color 120ms linear;
        }
        .rest-title a:hover { text-decoration-color: var(--text-muted); }
        .rest-source {
            font-family: var(--font-data);
            font-size: var(--t-xs);
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .empty {
            color: var(--text-muted);
            font-style: italic;
            margin: 0;
            max-width: 62ch;
        }

        .run-stats {
            font-family: var(--font-data);
            font-size: var(--t-xs);
            line-height: 1.6;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: 96px;
            padding-top: var(--s4);
        }

        a:focus-visible,
        .btn-link:focus-visible {
            outline: 2px solid var(--score);
            outline-offset: 3px;
            border-radius: var(--r-card);
        }

        @media (max-width: 620px) {
            .card--lead { padding: 28px 22px; }
            .card { padding: 20px 22px; }
            .masthead-meta { text-align: left; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 1ms !important;
                animation-duration: 1ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Intelligence Brief</h1>
            <div class="masthead-meta">
                2026-08-13<br>
                0 shown
            </div>
        </header>

        

        <section id="today">
            <h2>Today</h2>

            

            
            <p class="empty">Nothing cleared the signal filter, and there is no earlier brief on file to fall back to.</p>
            
        </section>

        

        <section id="weekly">
            <h2>This week, joined up</h2>
            
            <p class="empty">The weekly synthesis runs Sunday night. Nothing to join up yet.</p>
            
        </section>

        
    </div>
</body>
</html>
